<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | strip_html | escape }} · {% endif %}WorkShare · Yubo Dong</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:image" content="{{ page.thumbnail | default: 'assets/img/feature-img/pipeline.png' | absolute_url }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:card" content="summary_large_image"><meta name="theme-color" content="#f6f4ef">
<link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/workshare.css' | relative_url }}">
{% if page.layout == 'post' %}<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="{{ '/assets/js/vendor/katex.min.js' | relative_url }}"></script>
<script defer src="{{ '/assets/js/vendor/katex.auto-render.min.js' | relative_url }}" onload="renderMathInElement(document.querySelector('.article-content'));"></script>{% endif %}
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<header class="site-header"><div class="wrap navigation">
<a class="wordmark" href="{{ '/' | relative_url }}">WorkShare<span>.</span></a>
<nav class="nav-links" aria-label="Main navigation"><a href="{{ '/' | relative_url }}#projects">Projects</a><a href="{{ '/' | relative_url }}#about">About</a><a href="https://github.com/cnsdqd-dyb">GitHub ↗</a></nav>
</div></header>
<main id="main" class="wrap">{{ content }}</main>
<footer class="site-footer"><div class="wrap footer-inner"><span>Yubo Dong · Research &amp; open-source projects</span><span><a href="{{ '/' | relative_url }}">WorkShare</a><a href="https://github.com/cnsdqd-dyb/workshare">Source ↗</a><a href="#main">Back to top ↑</a></span></div></footer>
</body></html>
